name: Python

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the linter
        run: pip install ruff

      - name: Build (byte-compile every script)
        run: python -m compileall -q .

      - name: Lint (syntax errors and undefined names)
        run: ruff check . --select E9,F63,F7,F82

      - name: Test every lesson on its own
        run: for lesson in [0-9][0-9][0-9]-*/; do (cd "$lesson" && python -m unittest -v) || exit 1; done
